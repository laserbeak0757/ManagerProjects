services:
  openproject:
    image: openproject/openproject:16-slim
    container_name: openproject-community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
      OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST_NAME:-localhost:8080}"
      OPENPROJECT_ADDITIONAL__HOST__NAMES: "${OPENPROJECT_ADDITIONAL__HOST__NAMES:-localhost:8080,127.0.0.1:8080,host.docker.internal:8080}"
      OPENPROJECT_SECRET_KEY_BASE: "${OPENPROJECT_SECRET_KEY_BASE}"
      OPENPROJECT_DB_URL: "${OPENPROJECT_DB_URL}"
      OPENPROJECT_DB_DATABASE: "${OPENPROJECT_DB_DATABASE:-openproject}"
      OPENPROJECT_DB_USERNAME: "${OPENPROJECT_DB_USERNAME:-openproject}"
      OPENPROJECT_DB_PASSWORD: "${OPENPROJECT_DB_PASSWORD}"
    volumes:
      - openproject_assets:/var/openproject/assets

  proxy:
    image: nginx:1.27-alpine
    container_name: openproject-proxy
    restart: unless-stopped
    depends_on:
      - openproject
    ports:
      - "${OPENPROJECT_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16-alpine
    container_name: openproject-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${OPENPROJECT_DB_DATABASE:-openproject}"
      POSTGRES_USER: "${OPENPROJECT_DB_USERNAME:-openproject}"
      POSTGRES_PASSWORD: "${OPENPROJECT_DB_PASSWORD}"
    volumes:
      - openproject_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENPROJECT_DB_USERNAME:-openproject} -d ${OPENPROJECT_DB_DATABASE:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openproject_pgdata:
  openproject_assets:
